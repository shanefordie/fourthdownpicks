<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fourth Down Picks</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0b;--surface:#111113;--surface-2:#17171a;--border:#222226;--border-strong:#34343a;
  --text:#ededef;--muted:#8a8a93;--accent:#8ab4ff;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
button:disabled,select:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header,.wrap{max-width:1040px;margin:auto;padding-left:20px;padding-right:20px}
header{padding-top:40px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
h1{font-size:34px;font-weight:650;letter-spacing:-.03em;margin:8px 0 6px}
.sub{color:var(--muted);font-size:15px}

.top{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 20px}
.control,input,select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:0 14px;min-height:42px;font-size:14px;font-weight:500}
select{padding-right:10px}
button.control:hover,select:hover{border-color:var(--border-strong);background:var(--surface-2)}
input::placeholder{color:#5c5c64}
input:focus{border-color:var(--accent);outline:none}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding-bottom:60px}
@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:28px}header{padding-top:28px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.head h2,#weekTitle{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-weight:500}
#picked{color:var(--text)}

#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;padding:16px}
.game{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:0}
.time{color:var(--muted);font-size:12px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);align-items:stretch;gap:6px}
.team{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 6px;min-width:0;min-height:84px;text-align:center}
.team:hover:not(:disabled){border-color:var(--border-strong);background:var(--surface-2)}
.team.selected{background:var(--surface-2);border:1px solid var(--text);box-shadow:0 0 0 1px var(--text) inset}
.abbr{font-size:20px;font-weight:650;letter-spacing:-.01em;margin-bottom:2px}
.name{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.team.selected .name{color:var(--text)}
.at{color:var(--muted);font-size:11px;align-self:center;text-align:center}
.lock{color:var(--muted);font-size:12px;margin-top:12px}

.side{padding:20px}
.sideTitle{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
.section{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.player{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.player:last-child{border-bottom:0}
.pname{font-weight:550;font-size:14px}
.small{font-size:12px;color:var(--muted)}
.progress{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .3s ease}

#signIn,#signUp{border-radius:10px;padding:0 16px;min-height:42px;font-weight:600;font-size:14px;border:1px solid var(--border)}
#signIn{background:var(--text);color:#0a0a0b;border-color:var(--text)}
#signIn:hover{background:#fff}
#signUp{background:transparent;color:var(--text)}
#signUp:hover{border-color:var(--border-strong);background:var(--surface)}
#save{background:var(--text);color:#0a0a0b;border-color:var(--text)}
#save:hover{background:#fff}
#authBox{max-width:380px;margin:12vh auto 0;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
#authBox h2{margin:0 0 6px;font-size:20px;font-weight:650;letter-spacing:-.02em}
#authBox input{display:block;width:100%;margin:10px 0}
#authBox button{margin-right:6px;margin-top:4px}
#authMessage{color:var(--muted);font-size:13px;min-height:1em}

#nameBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:60;padding:20px}
.namecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px}
.namecard h2{margin:0 0 6px;font-size:20px;font-weight:650;letter-spacing:-.02em}
.namecard input{display:block;width:100%;margin:14px 0 10px}
#saveName{background:var(--text);color:#0a0a0b;border:1px solid var(--text);border-radius:10px;padding:0 16px;min-height:42px;font-weight:600;font-size:14px}
#nameMessage{color:var(--muted);font-size:13px;min-height:1em}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;z-index:50}
#toast{background:var(--text);color:#0a0a0b;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5)}

@media(max-width:480px){#games{grid-template-columns:minmax(0,1fr);padding:12px}.side{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>

<div id="authBox">
  <h2>Fourth Down Picks</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="signIn">Sign In</button>
  <button id="signUp">Create Account</button>
  <p id="authMessage"></p>
</div>

<div id="nameBox">
  <div class="namecard">
    <h2>Choose your display name</h2>
    <p class="small">This is how you'll appear on the leaderboard. You only do this once.</p>
    <input id="displayName" placeholder="Display name" maxlength="30" autocomplete="nickname">
    <button id="saveName">Continue</button>
    <p id="nameMessage"></p>
  </div>
</div>

<div id="appContent" style="display:none !important;">
  <header>
    <div class="eyebrow">FOURTH DOWN PICKS</div>
    <h1>Pick. Compete. Win.</h1>
    <div class="sub">Your group's weekly NFL prediction league.</div>
  </header>
  <div class="wrap">
    <div class="top">
      <select id="player" class="control" aria-label="Player"></select>
      <select id="week" class="control" aria-label="Week"></select>
      <button id="refresh" class="control">Refresh</button>
      <button id="save" class="control">Save</button>
      <button id="signOut" class="control">Sign out</button>
    </div>
    <div class="grid">
      <div class="card">
        <div class="head"><h2 id="weekTitle"></h2><span class="pill" id="picked"></span></div>
        <div id="games"></div>
      </div>
      <div class="card side">
        <div class="section">
          <div class="sideTitle">Leaderboard</div>
          <div id="leaderboard"></div>
        </div>
        <div class="section">
          <div class="sideTitle">Your accuracy</div>
          <div id="progressText" class="small"></div>
          <div class="progress"><div id="progress"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(
  "https://ymidmczneaufapqfaxgq.supabase.co",
  "sb_publishable_jS3BWAuUZAOEcE30GVy7eg_b4cWL8Iu"
);
const DEFAULT_PLAYERS = ["Shane"];
let players = [];
let myPlayer = null;
let started = false;
let picks = JSON.parse(localStorage.getItem("fdPicks") || "{}"), events = [];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function loadMyPlayer() {
  const { data, error } = await sb.rpc("claim_my_player", { p_name: null });
  if (error) throw error;
  if (data && data.length) { myPlayer = data[0].pname; return; }
  await askForName();
}

function askForName() {
  return new Promise(resolve => {
    const box = $("nameBox");
    box.style.display = "flex";
    $("displayName").focus();
    const submit = async () => {
      const name = $("displayName").value.trim();
      if (!name) { $("nameMessage").textContent = "Enter a name."; return; }
      $("saveName").disabled = true;
      const { data, error } = await sb.rpc("claim_my_player", { p_name: name });
      $("saveName").disabled = false;
      if (error) {
        $("nameMessage").textContent = error.code === "23505" ? "That name is taken. Try another." : "Error: " + error.message;
        return;
      }
      myPlayer = data[0].pname;
      box.style.display = "none";
      resolve();
    };
    $("saveName").onclick = submit;
    $("displayName").onkeydown = e => { if (e.key === "Enter") submit(); };
  });
}

async function loadPlayers() {
  const { data, error } = await sb.from("players").select("id,display_name").order("created_at", { ascending: true });
  if (error) throw error;
  players = data.map(p => p.display_name);
  if (!players.length) players = [...DEFAULT_PLAYERS];
  localStorage.setItem("fdPlayers", JSON.stringify(players));
  populatePlayers();
}

async function persist() {
  localStorage.setItem("fdPlayers", JSON.stringify(players));
  localStorage.setItem("fdPicks", JSON.stringify(picks));
}
function toast(s) {
  $("toast").textContent = s;
  $("toast").style.display = "block";
  setTimeout(() => $("toast").style.display = "none", 1500);
}
function weekNo(date) {
  const start = new Date("2026-09-09T00:00:00"), d = new Date(date);
  return Math.max(1, Math.floor((d - start) / 604800000) + 1);
}
function fmt(x) {
  return new Intl.DateTimeFormat("en-US", { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }).format(new Date(x));
}
function teams(e) {
  const c = e.competitions[0];
  return { a: c.competitors.find(x => x.homeAway === "away"), h: c.competitors.find(x => x.homeAway === "home") };
}
function locked(e) { return !!e.status?.type?.completed || new Date(e.date) <= new Date(); }

function populatePlayers() {
  const current = myPlayer || localStorage.getItem("fdCurrent") || players[0];
  $("player").innerHTML = players.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  $("player").value = players.includes(current) ? current : players[0];
}

async function syncGamesToDatabase() {
  const { data: weeks, error: weekError } = await sb.from("weeks").select("id, week_number");
  if (weekError) throw weekError;
  const weekIds = Object.fromEntries(weeks.map(w => [w.week_number, w.id]));
  const rows = events.map(e => {
    const t = teams(e);
    return {
      espn_event_id: e.id,
      week_id: weekIds[weekNo(e.date)],
      home_team: t.h.team.displayName,
      away_team: t.a.team.displayName,
      kickoff_at: e.date
    };
  }).filter(r => r.week_id);
  if (!rows.length) return;
  const { error } = await sb.from("games").upsert(rows, { onConflict: "espn_event_id" });
  if (error) throw error;
}

async function load() {
  $("games").innerHTML = "<div style='padding:22px;color:var(--muted)'>Loading the 2026 NFL schedule…</div>";
  try {
    const r = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&limit=500");
    const d = await r.json();
    events = d.events || [];

    syncGamesToDatabase()
      .catch(e => { console.error("Game sync failed:", e); toast("Game sync failed: " + (e.message || e)); })
      .finally(() => loadSharedPicks());

    const ws = [...new Set(events.map(e => weekNo(e.date)))].sort((a, b) => a - b);
    $("week").innerHTML = ws.map(w => `<option value="${w}">Week ${w}</option>`).join("");
    const current = Math.max(1, Math.min(18, weekNo(new Date())));
    $("week").value = ws.includes(current) ? current : ws[0];
    render();
  } catch (e) {
    $("games").innerHTML = "<div style='padding:22px'>Schedule could not be loaded. Press Refresh.</div>";
  }
}

async function loadSharedPicks() {
  let data = [];
  for (let from = 0; ; from += 1000) {
    const { data: page, error } = await sb.from("picks").select("player_id, game_id, selected_team").range(from, from + 999);
    if (error) { console.error("Shared picks failed to load:", error); toast("Couldn't load shared picks: " + error.message); return; }
    data = data.concat(page);
    if (page.length < 1000) break;
  }

  const { data: playerRows, error: playerError } = await sb.from("players").select("id, display_name");
  if (playerError) { console.error("Players failed to load:", playerError); return; }

  const { data: gameRows, error: gameError } = await sb.from("games").select("id, espn_event_id");
  if (gameError) { console.error("Games failed to load:", gameError); return; }

  const playerNames = Object.fromEntries(playerRows.map(p => [p.id, p.display_name]));
  const eventIds = Object.fromEntries(gameRows.map(g => [g.id, g.espn_event_id]));

  const shared = {};
  for (const pick of data) {
    const name = playerNames[pick.player_id];
    const eventId = eventIds[pick.game_id];
    if (!name || !eventId) continue;
    shared[name] ??= {};
    shared[name][eventId] = pick.selected_team;
  }
  picks = shared;
  render();
}

function render() {
  const p = $("player").value, w = +$("week").value;
  const gs = events.filter(e => weekNo(e.date) === w).sort((a, b) => new Date(a.date) - new Date(b.date));
  let count = 0;
  $("weekTitle").textContent = `Week ${w}`;
  $("games").innerHTML = gs.map(e => {
    const t = teams(e), pk = picks[p]?.[e.id], over = locked(e), notMine = !!myPlayer && p !== myPlayer, isLocked = over || notMine;
    if (pk) count++;
    return `<div class="game"><div class="time">${fmt(e.date)} · ${e.status?.type?.shortDetail || ""}</div><div class="teams">
      <button class="team ${pk === t.a.id ? "selected" : ""}" ${isLocked ? "disabled" : ""} onclick="choose('${e.id}','${t.a.id}')"><div class="abbr">${esc(t.a.abbreviation || "")}</div><div class="name">${esc(t.a.team.displayName)}</div></button>
      <div class="at">@</div>
      <button class="team home ${pk === t.h.id ? "selected" : ""}" ${isLocked ? "disabled" : ""} onclick="choose('${e.id}','${t.h.id}')"><div class="abbr">${esc(t.h.abbreviation || "")}</div><div class="name">${esc(t.h.team.displayName)}</div></button>
      </div><div class="lock">${over ? "🔒 Game started/final · picks locked" : notMine ? "Viewing " + esc(p) + "'s picks" : pk ? "✓ Pick saved" : "Tap a team to pick the winner"}</div></div>`;
  }).join("") || "<div style='padding:22px;color:var(--muted)'>No games this week.</div>";
  $("picked").textContent = `${count} / ${gs.length} picked`;
  updateBoard();
}

window.choose = async (id, team) => {
  const e = events.find(x => x.id === id);
  if (!e || locked(e)) return;

  const p = $("player").value;
  if (myPlayer && p !== myPlayer) return toast("You can only pick for yourself");

  picks[p] ??= {};
  picks[p][id] = team;
  render();
  toast("Saving pick...");

  try {
    const { data: { user }, error: userError } = await sb.auth.getUser();
    if (userError) throw userError;
    if (!user) throw new Error("Please sign in again.");

    const { data: account, error: accountError } = await sb.from("player_accounts").select("player_id").eq("user_id", user.id).single();
    if (accountError) throw accountError;

    const { data: game, error: gameError } = await sb.from("games").select("id").eq("espn_event_id", id).single();
    if (gameError) throw gameError;

    const { error: pickError } = await sb.from("picks").upsert({
      player_id: account.player_id,
      game_id: game.id,
      selected_team: team
    }, { onConflict: "player_id,game_id" });
    if (pickError) throw pickError;

    await persist();
    toast("Pick saved!");
  } catch (err) {
    console.error("Pick save failed:", err);
    toast("Save failed: " + (err.message || String(err)));
  }
};

function updateBoard() {
  const rows = players.map(p => {
    let correct = 0, graded = 0;
    events.forEach(e => {
      const winner = e.competitions?.[0]?.competitors?.find(x => x.winner)?.id;
      const pick = picks[p]?.[e.id];
      if (locked(e) && winner && pick) {
        graded++;
        if (winner === pick) correct++;
      }
    });
    return { p, correct, graded, accuracy: graded ? Math.round(correct / graded * 100) : 0 };
  }).sort((a, b) => b.correct - a.correct || b.accuracy - a.accuracy || a.p.localeCompare(b.p));

  $("leaderboard").innerHTML = rows.map((x, i) => `
    <div class="player">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:16px;font-size:13px;font-weight:600;color:${i===0?"var(--text)":"var(--muted)"}">${i+1}</span>
        <div>
          <div class="pname">${esc(x.p)}</div>
          <div class="small">${x.accuracy}% accuracy</div>
        </div>
      </div>
      <b>${x.correct}<span class="small"> / ${x.graded}</span></b>
    </div>`).join("");

  const me = rows.find(x => x.p === $("player").value) || { correct: 0, graded: 0 };
  $("progressText").textContent = `${me.correct} correct out of ${me.graded} graded picks`;
  $("progress").style.width = (me.graded ? me.correct / me.graded * 100 : 0) + "%";
}

$("player").onchange = () => { localStorage.setItem("fdCurrent", $("player").value); render(); };
$("week").onchange = render;
$("refresh").onclick = load;
$("signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
$("save").onclick = () => { persist(); toast("Picks saved"); };

async function startApp() {
  try { await loadMyPlayer(); } catch (e) { console.error("Player setup failed:", e); toast("Player setup failed: " + (e.message || e)); }
  try {
    await loadPlayers();
  } catch (e) {
    console.error("Player loading failed:", e);
    players = [...DEFAULT_PLAYERS];
    populatePlayers();
  }
  load();
}

$("signUp").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) { $("authMessage").textContent = "Enter an email and password."; return; }
  try {
    const { data, error } = await sb.auth.signUp({ email, password });
    console.log("Sign-up response:", data, error);
    $("authMessage").textContent = error
      ? "Sign-up error: " + error.message
      : "Account created! Check your email if confirmation is required.";
  } catch (err) {
    console.error("Sign-up failed:", err);
    $("authMessage").textContent = "Sign-up error: " + (err.message || String(err));
  }
};

$("signIn").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) { $("authMessage").textContent = "Enter an email and password."; return; }
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      $("authMessage").textContent = "Sign-in error: " + error.message;
    } else {
      $("authMessage").textContent = "";
      await updateAuthUI();
    }
  } catch (err) {
    console.error("Sign-in failed:", err);
    $("authMessage").textContent = "Sign-in error: " + (err.message || String(err));
  }
};

async function updateAuthUI() {
  const { data: { session } } = await sb.auth.getSession();
  $("authBox").style.display = session ? "none" : "block";
  $("appContent").style.setProperty("display", session ? "block" : "none", "important");
  if (session && !started) {
    started = true;
    startApp();
  }
}

sb.auth.onAuthStateChange(() => { updateAuthUI(); });
updateAuthUI();
</script>
</body>
</html>
